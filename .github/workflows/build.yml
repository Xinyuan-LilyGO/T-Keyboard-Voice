name: Build examples
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        example: [power, display, keys, ws2812, audio_playback, audio_record, qwiic, factory]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'scripts/select_example.py') }}
      - run: python -m pip install platformio==6.1.19
      - run: pio run -e ${{ matrix.example }}
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_host.py
      - run: python scripts/check_repository.py
      - run: python scripts/generate_audio.py --check
  arduino:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.6.0'
      - run: arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: python scripts/prepare_dependencies.py
      - run: python scripts/build_arduino.py
      - name: Save Arduino compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arduino-build-logs
          path: .build/logs/arduino/
          if-no-files-found: ignore
          retention-days: 7
  esp-idf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v4
      - name: Build all examples with ESP-IDF
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python scripts/prepare_dependencies.py
          python scripts/build_idf.py
      - name: Save ESP-IDF compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esp-idf-build-logs
          path: .build/logs/idf/
          if-no-files-found: ignore
          retention-days: 7
