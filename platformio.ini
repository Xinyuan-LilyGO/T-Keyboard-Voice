[platformio]
default_envs = factory
src_dir = examples/Factory
boards_dir = boards

[env]
; 固定平台提交，使用 Arduino-ESP32 3.x 的 I2S、LEDC 和 RMT API。
platform = https://github.com/meshtastic/pioarduino-platform-espressif32/archive/f89295f6a617a8ec611f4bd4eb2f998799dc5dc8.zip
platform_packages =
    tool-esptoolpy@https://github.com/pioarduino/esptool/archive/refs/tags/v5.3.0.zip
board = t_keyboard_voice_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
lib_ldf_mode = deep+
extra_scripts = pre:scripts/select_example.py
build_flags =
    -Wall
    -Wextra
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSENSORLIB_EXCLUDE_ALL=1
    -DSENSORLIB_EXCLUDE_PMIC=0
    -DSENSORLIB_EXCLUDE_PMIC_AXP2101=0
lib_deps =
    https://github.com/lewisxhe/SensorLib.git#2b9e591f245e447d3d00ec8798c3f49b897882d9

[env:power]
custom_example = Power

[env:display]
custom_example = Display
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX @ 1.2.26

[env:keys]
custom_example = Keys
lib_deps =
    ${env.lib_deps}
    lbuque/ButtonSense @ 1.0.0

[env:ws2812]
custom_example = WS2812

[env:audio_playback]
custom_example = AudioPlayback
lib_deps =
    ${env.lib_deps}
    ESP_I2S

[env:audio_record]
custom_example = AudioRecord
lib_deps =
    ${env.lib_deps}
    ESP_I2S

[env:qwiic]
custom_example = QWIIC

[env:factory]
custom_example = Factory
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX @ 1.2.26
    lbuque/ButtonSense @ 1.0.0
    ESP_I2S
